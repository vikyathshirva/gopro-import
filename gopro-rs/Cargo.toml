[package]
name = "gopro"
version = "0.1.0"
edition = "2021"
description = "Browse and import GoPro media over USB/Wi-Fi/SD card — CLI + TUI gallery"

[[bin]]
name = "gopro"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls"] }
ratatui = "0.30"
ratatui-image = { version = "11", default-features = false, features = ["crossterm", "image-defaults"] }
crossterm = "0.29"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
indicatif = "0.18"
dirs = "7"
regex = "1"
unicode-width = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
